<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SFTV Receiver (Playdate)</title>
<link rel="stylesheet" href="css/common.css">
<style>
  /* real Playdate: 76 x 74 mm body, 400x240 LCD ~58.7 x 35.2 mm; page scale 5 px/mm */
  .playdate { width: 380px; height: 370px; }
  .playdate .screen { left: 11.38%; top: 10.81%; width: 77.24%; height: 47.57%; background: #cdd4c7; }
  .playdate .screen canvas { background: #cdd4c7; filter: brightness(.94) sepia(.06); }
</style>
</head><body>
<nav class="topnav"><a class="tx" href="tx.html">Flipper · Send</a><a class="rx active" href="rx.html">Playdate · Receive</a></nav>
<div class="wrap">
  <div class="device playdate">
    <svg viewBox="0 0 76 74">
      <rect x="0.5" y="0.5" width="75" height="73" rx="5" fill="#f5c518" stroke="#222" stroke-width="0.6"/>
      <rect x="7.65" y="7" width="60.7" height="37.2" rx="1.2" fill="#161616"/>
      <!-- d-pad -->
      <g fill="#1a1a1a">
        <rect class="btn" id="up"    x="16" y="46.5" width="6" height="7" rx="1"/>
        <rect class="btn" id="down"  x="16" y="60.5" width="6" height="7" rx="1"/>
        <rect class="btn" id="left"  x="9"  y="53.5" width="7" height="6" rx="1"/>
        <rect class="btn" id="right" x="23" y="53.5" width="7" height="6" rx="1"/>
        <rect x="16" y="53.5" width="6" height="6"/>
      </g>
      <!-- A / B -->
      <circle class="btn" id="b" cx="54" cy="60" r="4.6" fill="#1a1a1a"/>
      <circle class="btn" id="a" cx="65" cy="53.5" r="4.6" fill="#1a1a1a"/>
      <text x="54" y="61.6" text-anchor="middle" fill="#f5c518" font-size="4.2" font-weight="700" font-family="system-ui">B</text>
      <text x="65" y="55.1" text-anchor="middle" fill="#f5c518" font-size="4.2" font-weight="700" font-family="system-ui">A</text>
      <!-- crank, folded along the right edge -->
      <rect x="73.2" y="38" width="3.6" height="17" rx="1.8" fill="#1a1a1a"/>
      <circle cx="75" cy="55.5" r="1.6" fill="#1a1a1a"/>
      <!-- lock button on the top edge -->
      <rect x="61" y="-0.2" width="7" height="1.6" rx="0.8" fill="#1a1a1a"/>
    </svg>
    <div class="screen"><canvas id="pd" width="400" height="240"></canvas></div>
  </div>
  <div id="hud" class="hud"></div>
  <div class="bar">
    <button class="act" id="listen">Allow mic &amp; listen</button>
    <button class="act" id="clear">Clear (A)</button>
    <button class="act" id="panel">Panel (▶)</button>
    <a class="act" id="save" style="display:none">Save PNG</a>
  </div>
  <p class="hint">Click listen and allow the microphone. Point a transmitter (this site in another tab, or a real Flipper) at the mic. The dolphin opens its mouth when it hears a signal.</p>
</div>
<script type="module" src="js/ui/rx-ui.js"></script>
</body></html>
