<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SFTV Receiver (Playdate)</title>
<link rel="stylesheet" href="css/common.css">
<style>
  /* Playdate render (assets/playdate.png, Panic's product render) scaled by 400/438.5 so its LCD
   * is exactly 400 CSS px wide; our 400x240 canvas sits on it at (60,60), 1 Playdate pixel =
   * 1 CSS px (2x2 on retina). The screen box is 245 tall to cover the render's own screen (its LCD is ~4 px taller than 5:3); the canvas sits at its top. */
  .playdate { width: 608px; height: 620px; }
  .playdate > img { position: absolute; left: 2.99px; top: -0.21px; width: 602.05px; height: 620.3px; }
  .playdate > svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .playdate > svg .btn { pointer-events: all; fill: transparent; cursor: pointer; }
  .playdate > svg .btn:active { fill: rgba(0,0,0,.12); }
  .playdate .screen { left: 60px; top: 60px; width: 400px; height: 245px; background: #b1afa8; }
  .playdate .screen canvas { position: absolute; left: 0; top: 0; width: 400px; height: 240px; image-rendering: pixelated; }
  .act.rec-on { background: #6b1f1f; border-color: #c44; }
  .act.on { background: #3a6b3a; border-color: #5c9c5c; }
</style>
</head><body>
<nav class="topnav"><a class="tx" href="tx.html">Flipper · Send</a><a class="rx active" href="rx.html">Playdate · Receive</a></nav>
<div class="wrap">
  <div class="device playdate">
    <img src="assets/playdate.png" alt="" draggable="false">
    <div class="screen"><canvas id="pd" width="400" height="240"></canvas></div>
    <svg viewBox="0 0 608 620">
      <rect class="btn" id="up" x="129" y="369" width="44" height="44" rx="6"/>
      <rect class="btn" id="down" x="129" y="457" width="44" height="44" rx="6"/>
      <rect class="btn" id="left" x="85" y="413" width="44" height="44" rx="6"/>
      <rect class="btn" id="right" x="173" y="413" width="44" height="44" rx="6"/>
      <circle class="btn" id="b" cx="336" cy="406" r="30"/>
      <circle class="btn" id="a" cx="437" cy="406" r="30"/>
      <circle class="btn" id="menu" cx="514" cy="109" r="16"/>
    </svg>
  </div>
  <div id="hud" class="hud"></div>
  <div class="bar">
    <button class="act" id="listen">Allow mic &amp; listen</button>
    <button class="act" id="clear">Clear (A)</button>
    <button class="act" id="reset" title="Reset picture, counters and decoder; keeps the microphone">Reset</button>
    <button class="act" id="panel">Panel (▶)</button>
    <button class="act" id="calib" title="Show the calibration screen (signal quality and tone levels) until switched off">Calibration</button>
    <button class="act" id="rec">● Record</button>
    <button class="act" id="save" style="display:none">Save WAV</button>
    <button class="act" id="gif" style="display:none">Save GIF</button>
  </div>
  <p class="hint">Click listen and allow the microphone. Point a transmitter (this site in another tab, or a real Flipper) at the mic. The dolphin opens its mouth when it hears a signal.</p>
</div>
<script src="js/rx.bundle.js?v=1794222571"></script>
</body></html>
