<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SFTV Transmitter (Flipper)</title>
<link rel="stylesheet" href="css/common.css">
<style>
  /* qFlipper device art (assets/flipper.svg, viewBox 360x156) with the LCD, LED and button
   * hotspots laid over it in the same coordinates */
  /* 720 px wide = 2 CSS px per viewBox unit, so each LCD pixel is exactly 2x2 CSS px: an
   * integer scale keeps the 1-bit font crisp (non-integer scaling makes pixels uneven) */
  .flipper { width: min(720px, 94vw); aspect-ratio: 360 / 156; }
  .flipper > img, .flipper > svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .flipper > svg { pointer-events: none; }
  .flipper > svg .btn { pointer-events: all; fill: transparent; }
  .flipper > svg .btn:active { fill: rgba(254,138,44,.25); opacity: 1; }
  /* LCD 93,26.5 128x64 in viewBox units (centred in the orange screen 89,22 136x73) */
  .flipper .screen { left: calc(93% / 3.6); top: calc(26.5% / 1.56); width: calc(128% / 3.6); height: calc(64% / 1.56); background: #fe8a2c; }
  .flipper .screen canvas { background: #fe8a2c; }
  #led { transition: fill .05s; }
</style>
</head><body>
<nav class="topnav"><a class="tx active" href="tx.html">Flipper · Send</a><a class="rx" href="rx.html">Playdate · Receive</a></nav>
<div class="wrap">
  <div class="device flipper">
    <img src="assets/flipper.svg" alt="" draggable="false">
    <div class="screen"><canvas id="lcd" width="128" height="64"></canvas></div>
    <svg viewBox="0 0 360 156">
      <circle id="led" cx="238.5" cy="94.5" r="2.4" fill="#333"/>
      <circle class="btn" id="ok" cx="274.5" cy="58.5" r="11.5"/>
      <rect class="btn" id="up" x="264" y="25" width="21" height="19" rx="4"/>
      <rect class="btn" id="down" x="264" y="73" width="21" height="19" rx="4"/>
      <rect class="btn" id="left" x="240" y="48" width="19" height="21" rx="4"/>
      <rect class="btn" id="right" x="290" y="48" width="19" height="21" rx="4"/>
      <circle class="btn" id="back" cx="326.5" cy="82.5" r="11.5"/>
    </svg>
  </div>
  <div class="bar">
    <label class="act">Load picture<input id="file" type="file" accept="image/*" hidden></label>
    <button class="act" id="send">Send ▶</button>
    <button class="act" id="stop">Stop ◼</button>
  </div>
  <div class="bar samples" id="samples" aria-label="Sample pictures"></div>
  <textarea id="note-text" rows="2" maxlength="65535" placeholder="Type a note, then Send note…" style="width:min(560px,92vw);margin:4px auto 0;display:block;box-sizing:border-box;font:13px system-ui"></textarea>
  <div class="bar">
    <button class="act" id="send-note">Send note ▶</button>
  </div>
  <p id="status" class="status" aria-live="polite"></p>
  <p class="hint">Arrows switch pictures, OK/Send plays it as sound. Put the speaker close to the receiver; if nothing arrives, try headphones laid next to it. First send needs a click (browser audio policy).</p>
</div>
<script src="js/tx.bundle.js?v=1794264539"></script>
</body></html>
