<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SFTV Transmitter (Flipper)</title>
<link rel="stylesheet" href="css/common.css">
<style>
  /* real Flipper Zero: 100 x 40 mm landscape body, 128x64 LCD ~32 x 16 mm; page scale 5 px/mm */
  .flipper { width: 500px; height: 200px; }
  .flipper .screen { left: 7%; top: 20%; width: 32%; height: 40%; background: #f39a52; border-radius: 2px; }
  .flipper .screen canvas { background: #f39a52; }
  #led { transition: fill .05s; }
</style>
</head><body>
<nav class="topnav"><a class="tx active" href="tx.html">Flipper · Send</a><a class="rx" href="rx.html">Playdate · Receive</a></nav>
<div class="wrap">
  <div class="device flipper">
    <svg viewBox="0 0 100 40">
      <rect x="0.5" y="0.5" width="99" height="39" rx="6" fill="#f26b21" stroke="#222" stroke-width="0.6"/>
      <!-- LCD window -->
      <rect x="6" y="7" width="34" height="18" rx="1" fill="#141414"/>
      <!-- RGB notification LED -->
      <circle id="led" cx="44" cy="8.5" r="1.3" fill="#333"/>
      <!-- 5-way pad -->
      <circle cx="68" cy="20" r="11.5" fill="#f4efe6" stroke="#222" stroke-width="0.5"/>
      <circle class="btn" id="ok" cx="68" cy="20" r="4.6" fill="#e9e2d5" stroke="#222" stroke-width="0.4"/>
      <path class="btn" id="up"    d="M68 10.5 l2.4 3.6 h-4.8 z" fill="#333"/>
      <path class="btn" id="down"  d="M68 29.5 l2.4 -3.6 h-4.8 z" fill="#333"/>
      <path class="btn" id="left"  d="M58.5 20 l3.6 2.4 v-4.8 z" fill="#333"/>
      <path class="btn" id="right" d="M77.5 20 l-3.6 2.4 v-4.8 z" fill="#333"/>
      <!-- back -->
      <circle class="btn" id="back" cx="88" cy="30" r="4" fill="#f4efe6" stroke="#222" stroke-width="0.5"/>
      <path d="M86.6 30 l2.2 -1.6 v3.2 z" fill="#333"/>
    </svg>
    <div class="screen"><canvas id="lcd" width="128" height="64"></canvas></div>
  </div>
  <div class="bar">
    <label class="act">Load picture<input id="file" type="file" accept="image/*" hidden></label>
    <button class="act" id="send">Send ▶</button>
    <button class="act" id="stop">Stop ◼</button>
  </div>
  <div class="bar">
    <select class="act" id="note-preset"><option value="">Note preset…</option></select>
    <button class="act" id="send-note">Send note ▶</button>
  </div>
  <textarea id="note-text" rows="2" maxlength="1000" placeholder="Type a note, then Send note…" style="width:92%;margin:4px auto 0;display:block;box-sizing:border-box;font:13px system-ui"></textarea>
  <p class="hint">Arrows switch pictures, OK/Send plays it as sound. Put the speaker near the receiver's mic. First send needs a click (browser audio policy).</p>
</div>
<script type="module" src="js/ui/tx-ui.js"></script>
</body></html>
